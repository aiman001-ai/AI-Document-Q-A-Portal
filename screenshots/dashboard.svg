<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="600" fill="#f8fafc" />

  <!-- App Header / Navbar -->
  <rect x="0" y="0" width="1000" height="65" fill="#0f172a" />
  <rect x="25" y="14" width="36" height="36" rx="8" fill="url(#primaryGrad)" />
  <path d="M43 24 L35 24 A 2 2 0 0 0 33 26 L33 38 A 2 2 0 0 0 35 40 L47 40 A 2 2 0 0 0 49 38 L49 30 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="43 24 43 30 49 30" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  
  <text x="72" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">AI DocPortal</text>
  <text x="72" y="47" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500">Document RAG &amp; Intelligence</text>

  <!-- Nav links -->
  <rect x="260" y="16" width="105" height="32" rx="6" fill="#1e293b" />
  <text x="275" y="37" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">📄 Documents</text>
  <text x="390" y="37" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">⬆ Upload PDF</text>
  <text x="500" y="37" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">💬 Chat &amp; Q&amp;A</text>

  <!-- User pill -->
  <rect x="850" y="18" width="125" height="28" rx="14" fill="#1e293b" />
  <circle cx="866" cy="32" r="10" fill="#4f46e5" />
  <text x="862" y="36" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">D</text>
  <text x="884" y="36" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">demo_user</text>

  <!-- Page Title & Actions -->
  <text x="40" y="115" fill="#0f172a" font-family="sans-serif" font-size="22" font-weight="800">Document Intelligence Center</text>
  <text x="40" y="135" fill="#64748b" font-family="sans-serif" font-size="12">Manage indexed PDF files, inspect semantic vector chunks, and initiate conversational queries.</text>

  <rect x="760" y="98" width="100" height="36" rx="8" fill="url(#indigoGrad)" filter="url(#shadow)" />
  <text x="782" y="121" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">+ Upload PDF</text>

  <rect x="870" y="98" width="90" height="36" rx="8" fill="#e2e8f0" />
  <text x="892" y="121" fill="#1e293b" font-family="sans-serif" font-size="12" font-weight="600">Open Chat</text>

  <!-- Stat Cards -->
  <g transform="translate(40, 160)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="215" height="85" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="15" y="20" width="45" height="45" rx="10" fill="#eef2ff" />
    <text x="28" y="48" fill="#4f46e5" font-family="sans-serif" font-size="20">📄</text>
    <text x="75" y="42" fill="#0f172a" font-family="sans-serif" font-size="22" font-weight="800">4</text>
    <text x="75" y="58" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="700">INDEXED DOCUMENTS</text>

    <!-- Card 2 -->
    <rect x="235" y="0" width="215" height="85" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="250" y="20" width="45" height="45" rx="10" fill="#ecfeff" />
    <text x="263" y="48" fill="#0891b2" font-family="sans-serif" font-size="20">📖</text>
    <text x="310" y="42" fill="#0f172a" font-family="sans-serif" font-size="22" font-weight="800">18</text>
    <text x="310" y="58" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="700">PAGES EXTRACTED</text>

    <!-- Card 3 -->
    <rect x="470" y="0" width="215" height="85" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="485" y="20" width="45" height="45" rx="10" fill="#ecfdf5" />
    <text x="498" y="48" fill="#059669" font-family="sans-serif" font-size="20">🧩</text>
    <text x="545" y="42" fill="#0f172a" font-family="sans-serif" font-size="22" font-weight="800">52</text>
    <text x="545" y="58" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="700">SEMANTIC CHUNKS</text>

    <!-- Card 4 -->
    <rect x="705" y="0" width="215" height="85" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <rect x="720" y="20" width="45" height="45" rx="10" fill="#faf5ff" />
    <text x="733" y="48" fill="#9333ea" font-family="sans-serif" font-size="20">🛡️</text>
    <text x="780" y="40" fill="#0f172a" font-family="sans-serif" font-size="17" font-weight="800">JWT AUTH</text>
    <text x="780" y="58" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="700">ACCESS CONTROL</text>
  </g>

  <!-- Document Table Card -->
  <g transform="translate(40, 270)">
    <rect x="0" y="0" width="920" height="295" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

    <!-- Table Header Bar -->
    <rect x="0" y="0" width="920" height="50" rx="12" fill="#f8fafc" />
    <rect x="15" y="10" width="260" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="28" y="30" fill="#94a3b8" font-family="sans-serif" font-size="11">🔍 Search documents by title...</text>

    <!-- Table Columns -->
    <rect x="0" y="50" width="920" height="32" fill="#f1f5f9" />
    <text x="25" y="70" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="700">DOCUMENT NAME</text>
    <text x="350" y="70" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="700">PAGES</text>
    <text x="440" y="70" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="700">CHUNKS</text>
    <text x="530" y="70" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="700">SIZE</text>
    <text x="610" y="70" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="700">STATUS</text>
    <text x="810" y="70" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="700">ACTIONS</text>

    <!-- Row 1: KYC Report -->
    <g transform="translate(0, 82)">
      <line x1="0" y1="52" x2="920" y2="52" stroke="#f1f5f9" stroke-width="1" />
      <rect x="25" y="12" width="30" height="26" rx="4" fill="#fee2e2" />
      <text x="31" y="29" fill="#dc2626" font-family="sans-serif" font-size="9" font-weight="800">PDF</text>
      <text x="65" y="24" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="700">kyc_verification_audit_report</text>
      <text x="65" y="39" fill="#94a3b8" font-family="sans-serif" font-size="10">Aadhaar/PAN OCR verification &amp; ELA tamper analysis</text>
      <text x="350" y="32" fill="#334155" font-family="sans-serif" font-size="11">1 page</text>
      <text x="440" y="32" fill="#334155" font-family="sans-serif" font-size="11">3 chunks</text>
      <text x="530" y="32" fill="#334155" font-family="sans-serif" font-size="11">18.4 KB</text>
      <rect x="610" y="18" width="58" height="22" rx="11" fill="#ecfdf5" />
      <text x="622" y="33" fill="#059669" font-family="sans-serif" font-size="10" font-weight="700">READY</text>
      <rect x="770" y="15" width="70" height="26" rx="6" fill="#eef2ff" stroke="#c7d2fe" />
      <text x="782" y="32" fill="#4f46e5" font-family="sans-serif" font-size="11" font-weight="700">💬 Chat</text>
      <text x="860" y="32" fill="#64748b" font-family="sans-serif" font-size="13">👁 ⬇ 🗑</text>
    </g>

    <!-- Row 2: SLA Agreement -->
    <g transform="translate(0, 134)">
      <line x1="0" y1="52" x2="920" y2="52" stroke="#f1f5f9" stroke-width="1" />
      <rect x="25" y="12" width="30" height="26" rx="4" fill="#fee2e2" />
      <text x="31" y="29" fill="#dc2626" font-family="sans-serif" font-size="9" font-weight="800">PDF</text>
      <text x="65" y="24" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="700">enterprise_service_sla_contract</text>
      <text x="65" y="39" fill="#94a3b8" font-family="sans-serif" font-size="10">NetApp &amp; CloudCore SLA terms, pricing, and breach terms</text>
      <text x="350" y="32" fill="#334155" font-family="sans-serif" font-size="11">2 pages</text>
      <text x="440" y="32" fill="#334155" font-family="sans-serif" font-size="11">5 chunks</text>
      <text x="530" y="32" fill="#334155" font-family="sans-serif" font-size="11">24.2 KB</text>
      <rect x="610" y="18" width="58" height="22" rx="11" fill="#ecfdf5" />
      <text x="622" y="33" fill="#059669" font-family="sans-serif" font-size="10" font-weight="700">READY</text>
      <rect x="770" y="15" width="70" height="26" rx="6" fill="#eef2ff" stroke="#c7d2fe" />
      <text x="782" y="32" fill="#4f46e5" font-family="sans-serif" font-size="11" font-weight="700">💬 Chat</text>
      <text x="860" y="32" fill="#64748b" font-family="sans-serif" font-size="13">👁 ⬇ 🗑</text>
    </g>

    <!-- Row 3: Financial Invoice -->
    <g transform="translate(0, 186)">
      <rect x="25" y="12" width="30" height="26" rx="4" fill="#fee2e2" />
      <text x="31" y="29" fill="#dc2626" font-family="sans-serif" font-size="9" font-weight="800">PDF</text>
      <text x="65" y="24" fill="#0f172a" font-family="sans-serif" font-size="12" font-weight="700">quarterly_vendor_invoice_q3</text>
      <text x="65" y="39" fill="#94a3b8" font-family="sans-serif" font-size="10">Tax invoice USD 21,000 with Net-30 payment clauses</text>
      <text x="350" y="32" fill="#334155" font-family="sans-serif" font-size="11">3 pages</text>
      <text x="440" y="32" fill="#334155" font-family="sans-serif" font-size="11">8 chunks</text>
      <text x="530" y="32" fill="#334155" font-family="sans-serif" font-size="11">31.8 KB</text>
      <rect x="610" y="18" width="58" height="22" rx="11" fill="#ecfdf5" />
      <text x="622" y="33" fill="#059669" font-family="sans-serif" font-size="10" font-weight="700">READY</text>
      <rect x="770" y="15" width="70" height="26" rx="6" fill="#eef2ff" stroke="#c7d2fe" />
      <text x="782" y="32" fill="#4f46e5" font-family="sans-serif" font-size="11" font-weight="700">💬 Chat</text>
      <text x="860" y="32" fill="#64748b" font-family="sans-serif" font-size="13">👁 ⬇ 🗑</text>
    </g>
  </g>
</svg>

